server {
    listen 80;
    server_name _;
    location = /healthz { return 200 'ok'; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location / { return 503 'HTTPS setup in progress'; }
}
