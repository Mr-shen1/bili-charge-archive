spring:
  application:
    name: bili-charge-archive
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

app:
  admin:
    username: ${ADMIN_USERNAME}
    password-bcrypt: ${ADMIN_PASSWORD_BCRYPT}
  monitor-token: ${MONITOR_API_TOKEN}
